version: "1.0.0"
name: "aion-code-reviewer"
description: "An AI-powered sandbox for evaluating code review and bug-fixing capabilities."
tasks:
  - id: "style-cleanup"
    name: "Style & Linting"
    difficulty: "easy"
    description: "Fix indentation and remove unused imports."
    expected_reward: 1.0
  - id: "efficiency-boost"
    name: "Algorithm Optimization"
    difficulty: "medium"
    description: "Refactor a nested loop into a more efficient lookup."
    expected_reward: 1.0
  - id: "security-audit"
    name: "Security Vulnerability"
    difficulty: "hard"
    description: "Identify and fix a SQL injection vulnerability."
    expected_reward: 1.0