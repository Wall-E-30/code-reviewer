version: "1.1.0"
name: "aion-code-reviewer"
description: "Verifiable reinforcement learning environment for automated code review."
environment:
  entrypoint: "rl.env:ReviewEnv"
  specification: "openenv.spec.json"
tasks:
  - id: "style-cleanup"
    name: "Style & Linting"
    difficulty: "easy"
    description: "Fix indentation and remove unused imports."
  - id: "efficiency-boost"
    name: "Algorithm Optimization"
    difficulty: "medium"
    description: "Refactor a nested loop into a more efficient lookup."
  - id: "security-audit"
    name: "Security Vulnerability"
    difficulty: "hard"
    description: "Identify and fix a SQL injection vulnerability."
