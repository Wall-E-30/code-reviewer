name: 'Aion Code Reviewer'
description: 'High-precision, verifiable AI code reviewer for GitHub Pull Requests'
author: 'Wall-E-30'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token for reading PR diffs and posting review comments'
    required: false
    default: ${{ github.token }}
  github_token:
    description: 'Alias for github-token'
    required: false
    default: ''
  api-key:
    description: 'BYOK API key for model inference (Groq, OpenRouter, OpenAI, Hugging Face)'
    required: false
    default: ''
  api_key:
    description: 'Alias for api-key'
    required: false
    default: ''
  provider:
    description: 'Inference provider (mock, groq, openrouter, ollama, openai, huggingface)'
    required: false
    default: 'mock'
  model:
    description: 'Model identifier'
    required: false
    default: 'qwen-2.5-coder-32b'
  max-comments:
    description: 'Maximum inline comments per review (hard ceiling)'
    required: false
    default: '5'
  max_comments:
    description: 'Alias for max-comments'
    required: false
    default: ''
  min-confidence:
    description: 'Confidence threshold (0.0 to 1.0) for posting comments'
    required: false
    default: '0.7'
  min_confidence:
    description: 'Alias for min-confidence'
    required: false
    default: ''
  enable-telemetry:
    description: 'Enable anonymized review and telemetry logging'
    required: false
    default: 'true'
  enable_telemetry:
    description: 'Alias for enable-telemetry'
    required: false
    default: ''
  mode:
    description: 'Review mode: visible (posts inline comments to PR) or shadow (silent analysis, logs only, no PR comments)'
    required: false
    default: 'visible'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "pydantic>=2.0" "httpx>=0.25.0" "ruff"

    - name: Run Aion Code Reviewer
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token || inputs.github_token || github.token }}
        INPUT_API_KEY: ${{ inputs.api-key || inputs.api_key || '' }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_MAX_COMMENTS: ${{ inputs.max-comments || inputs.max_comments || '5' }}
        INPUT_MIN_CONFIDENCE: ${{ inputs.min-confidence || inputs.min_confidence || '0.7' }}
        INPUT_ENABLE_TELEMETRY: ${{ inputs.enable-telemetry || inputs.enable_telemetry || 'true' }}
        INPUT_MODE: ${{ inputs.mode }}
      run: python -m action.main

